<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52">
  <!-- Símbolo Casa Vermelha Oficial Cursino -->
  <g transform="translate(4, 4)">
    <!-- Contorno da Casa -->
    <path d="M 22 2 L 40 18 L 40 38 L 4 38 L 4 18 Z" fill="none" stroke="#C8102E" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Telhado e Chaminé / Detalhe Superior -->
    <path d="M 0 19 L 22 0 L 44 19" fill="none" stroke="#C8102E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 32 6 L 32 12" fill="none" stroke="#C8102E" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Janela Interna Estruturada -->
    <rect x="15" y="19" width="14" height="12" rx="2" fill="none" stroke="#C8102E" stroke-width="2.5"/>
    <line x1="22" y1="19" x2="22" y2="31" stroke="#C8102E" stroke-width="2"/>
    <line x1="15" y1="25" x2="29" y2="25" stroke="#C8102E" stroke-width="2"/>
  </g>
  
  <!-- Tipografia Oficial e Nítida -->
  <text x="60" y="27" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="22" fill="#0B1120" letter-spacing="-0.02em">CURSINO</text>
  <text x="61" y="42" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="9.5" fill="#C8102E" letter-spacing="0.16em">FERRO E AÇO</text>
</svg>
